<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trámites en línea — Puerto Escondido, Córdoba</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#f4f4f2; --card:#ffffff; --ink:#182233; --muted:#5c6672;
    --accent:#0c2f5e; --accent-dark:#081d3b; --border:#dfe1e6;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1420; --card:#161e2c; --ink:#e9edf5; --muted:#9aa5b5;
      --accent:#4a7fc4; --accent-dark:#6b99d6; --border:#28324a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1420; --card:#161e2c; --ink:#e9edf5; --muted:#9aa5b5;
    --accent:#4a7fc4; --accent-dark:#6b99d6; --border:#28324a;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Georgia','Times New Roman',serif; min-height:100%; padding:0 0 48px;}
  .flagbar{display:flex; height:6px; width:100%;}
  .flagbar div:first-child{flex:1; background:var(--accent);}
  .flagbar div:last-child{flex:1; background:#ffffff; border-bottom:1px solid var(--border);}
  .wrap{max-width:640px; margin:0 auto; padding:32px 16px 0;}
  header{text-align:center; margin-bottom:20px;}
  header .seal{width:44px; height:44px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-family:Georgia,serif; margin:0 auto 12px;}
  header .badge{display:inline-block; font-family:Arial,sans-serif; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
  h1{font-size:19px; margin:0 0 6px; line-height:1.3; font-weight:normal; color:var(--accent);}
  header p{color:var(--muted); font-family:Arial,sans-serif; font-size:13px; margin:0;}
  .tabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; justify-content:center;}
  .tab{font-family:Arial,sans-serif; font-size:12px; padding:8px 12px; border-radius:3px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer;}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:6px; padding:24px; margin-bottom:20px;}
  label{display:block; font-family:Arial,sans-serif; font-size:12px; color:var(--muted); margin:14px 0 5px;}
  label:first-of-type{margin-top:0;}
  input, select{width:100%; padding:10px 12px; border-radius:3px; border:1px solid var(--accent); background:transparent; color:var(--ink); font-family:Arial,sans-serif; font-size:14.5px;}
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .row2{display:flex; gap:12px;}
  .row2 > div{flex:1;}
  button.primary{width:100%; margin-top:20px; padding:13px; border:none; border-radius:3px; background:var(--accent); color:#fff; font-family:Arial,sans-serif; font-size:14px; font-weight:600; letter-spacing:.03em; cursor:pointer;}
  button.primary:hover{background:var(--accent-dark);}
  button.primary:disabled{opacity:.6; cursor:default;}
  .hint{font-family:Arial,sans-serif; font-size:12px; color:var(--muted); margin-top:10px; text-align:center;}
  .status{font-family:Arial,sans-serif; font-size:13px; text-align:center; margin-top:12px; min-height:18px;}
  .status.ok{color:var(--accent);}
  .status.err{color:#c0392b;}
</style>
</head>
<body>
<div class="flagbar"><div></div><div></div></div>
<div class="wrap">
  <header>
    <div class="seal">PE</div>
    <span class="badge">Municipio de Puerto Escondido · Córdoba</span>
    <h1>Trámites en línea</h1>
    <p>Escoge un trámite, llena los datos y genera el documento en PDF al instante.</p>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="card" id="formCard"></div>
</div>

<script>
const hoy = new Date();
const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fechaLarga = `${hoy.getDate()} días del mes de ${meses[hoy.getMonth()]} de ${hoy.getFullYear()}`;

const TRAMITES = {
  residencia: {
    label: 'Certificado de residencia',
    titulo: 'CERTIFICADO DE RESIDENCIA',
    campos: [
      {id:'nombre', label:'Nombre completo', placeholder:'Ej. María José Pérez Salgado'},
      {id:'tipoDoc', label:'Tipo de documento', select:['Cédula de ciudadanía','Cédula de extranjería','Tarjeta de identidad']},
      {id:'numDoc', label:'Número de documento', placeholder:'Ej. 1067412345'},
      {id:'direccion', label:'Dirección de residencia', placeholder:'Ej. Calle 5 #10-20'},
      {id:'barrio', label:'Barrio o corregimiento', placeholder:'Ej. Cristo Rey'},
      {id:'tiempo', label:'Tiempo de residencia', placeholder:'Ej. 3 años'},
      {id:'funcionario', label:'Nombre del Secretario(a) de Gobierno', placeholder:'Ej. Claribel Páez Cabeza'}
    ],
    firmante: 'Secretario(a) de Gobierno',
    cuerpo: (d) => `El(la) señor(a) ${d.nombre}, identificado(a) con ${d.tipoDoc.toLowerCase()} número ${d.numDoc}, reside actualmente en la dirección ${d.direccion}, barrio/corregimiento ${d.barrio}, jurisdicción del municipio de Puerto Escondido, Córdoba, desde hace ${d.tiempo}.`
  },
  pazysalvo: {
    label: 'Paz y salvo de Ind. y Comercio',
    titulo: 'PAZ Y SALVO DE INDUSTRIA Y COMERCIO',
    campos: [
      {id:'nombre', label:'Nombre o razón social', placeholder:'Ej. Comercializadora El Progreso S.A.S.'},
      {id:'numDoc', label:'NIT o cédula', placeholder:'Ej. 900.123.456-7'},
      {id:'establecimiento', label:'Nombre del establecimiento', placeholder:'Ej. Ferretería El Progreso'},
      {id:'direccion', label:'Dirección del establecimiento', placeholder:'Ej. Carrera 3 #8-15'},
      {id:'vigencia', label:'Vigencia certificada', placeholder:'Ej. 2025'},
      {id:'funcionario', label:'Nombre del Secretario(a) de Hacienda', placeholder:'Ej. Jorge Luis Support'}
    ],
    firmante: 'Secretario(a) de Hacienda',
    cuerpo: (d) => `Que el(la) contribuyente ${d.nombre}, identificado(a) con NIT/cédula ${d.numDoc}, propietario(a) del establecimiento de comercio "${d.establecimiento}", ubicado en ${d.direccion}, se encuentra a paz y salvo por concepto del Impuesto de Industria y Comercio correspondiente a la vigencia ${d.vigencia}.`
  },
  funcionamiento: {
    label: 'Permiso de funcionamiento',
    titulo: 'PERMISO DE FUNCIONAMIENTO',
    campos: [
      {id:'nombre', label:'Nombre del propietario', placeholder:'Ej. Carlos Andrés Julio Martínez'},
      {id:'numDoc', label:'Cédula del propietario', placeholder:'Ej. 1067998877'},
      {id:'establecimiento', label:'Nombre del establecimiento', placeholder:'Ej. Panadería Doña Rosa'},
      {id:'actividad', label:'Actividad económica', placeholder:'Ej. Panadería y repostería'},
      {id:'direccion', label:'Dirección del establecimiento', placeholder:'Ej. Calle 4 #6-22'},
      {id:'funcionario', label:'Nombre del Secretario(a) de Planeación', placeholder:'Ej. Ana Milena Torres'}
    ],
    firmante: 'Secretario(a) de Planeación',
    cuerpo: (d) => `Que el establecimiento de comercio "${d.establecimiento}", de propiedad de ${d.nombre}, identificado(a) con cédula número ${d.numDoc}, dedicado a la actividad de ${d.actividad}, ubicado en ${d.direccion}, cumple con los requisitos de uso del suelo y demás normas vigentes para su funcionamiento en el municipio de Puerto Escondido, Córdoba.`
  }
};

let current = 'residencia';

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  Object.keys(TRAMITES).forEach(key => {
    const b = document.createElement('button');
    b.className = 'tab' + (key === current ? ' active' : '');
    b.textContent = TRAMITES[key].label;
    b.addEventListener('click', () => { current = key; renderTabs(); renderForm(); });
    tabsEl.appendChild(b);
  });
}

function renderForm(){
  const t = TRAMITES[current];
  const card = document.getElementById('formCard');
  card.innerHTML = '';
  t.campos.forEach(c => {
    const lab = document.createElement('label');
    lab.textContent = c.label;
    lab.setAttribute('for', c.id);
    card.appendChild(lab);
    if(c.select){
      const sel = document.createElement('select');
      sel.id = c.id;
      c.select.forEach(opt => {
        const o = document.createElement('option');
        o.textContent = opt;
        sel.appendChild(o);
      });
      card.appendChild(sel);
    } else {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.id = c.id; inp.placeholder = c.placeholder || '';
      card.appendChild(inp);
    }
  });
  const btn = document.createElement('button');
  btn.className = 'primary';
  btn.textContent = 'Generar documento en PDF';
  btn.addEventListener('click', generarPDF);
  card.appendChild(btn);
  const status = document.createElement('p');
  status.className = 'status'; status.id = 'status';
  card.appendChild(status);
  const hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = 'Documento de demostración — no tiene validez oficial hasta ser expedido por la Alcaldía.';
  card.appendChild(hint);
}

async function generarPDF(){
  const t = TRAMITES[current];
  const statusEl = document.getElementById('status');
  const btn = document.querySelector('#formCard button.primary');
  const data = {};
  let faltante = false;
  t.campos.forEach(c => {
    const el = document.getElementById(c.id);
    const val = el.value.trim();
    if(!val && !c.select){ faltante = true; }
    data[c.id] = val;
  });
  if(faltante){
    statusEl.textContent = 'Por favor completa todos los campos.';
    statusEl.className = 'status err';
    return;
  }

  btn.disabled = true;
  statusEl.textContent = 'Generando documento...';
  statusEl.className = 'status';

  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'letter' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const margin = 70;
    let y = 90;

    doc.setFont('times','bold'); doc.setFontSize(13);
    doc.text('ALCALDÍA MUNICIPAL DE PUERTO ESCONDIDO, CÓRDOBA', pageWidth/2, y, {align:'center'}); y += 20;
    doc.setFontSize(12);
    doc.text((t.firmante.includes('Hacienda') ? 'SECRETARÍA DE HACIENDA' : t.firmante.includes('Planeación') ? 'SECRETARÍA DE PLANEACIÓN' : 'SECRETARÍA DE GOBIERNO'), pageWidth/2, y, {align:'center'}); y += 50;

    doc.setFontSize(15);
    doc.text(t.titulo, pageWidth/2, y, {align:'center'}); y += 45;

    doc.setFont('times','normal'); doc.setFontSize(11.5);
    doc.text('En uso de sus facultades legales, se', margin, y); y += 18;
    doc.text('procede a expedir el presente documento.', margin, y); y += 34;

    doc.setFont('times','bold');
    doc.text('CERTIFICA / HACE CONSTAR QUE:', margin, y); y += 30;

    doc.setFont('times','normal');
    const lineas = doc.splitTextToSize(t.cuerpo(data), pageWidth - margin*2);
    doc.text(lineas, margin, y);
    y += lineas.length * 16 + 24;

    const cierre = `El presente documento se expide a solicitud del interesado, para los fines que estime convenientes, a los ${fechaLarga}.`;
    const lineasCierre = doc.splitTextToSize(cierre, pageWidth - margin*2);
    doc.text(lineasCierre, margin, y);
    y += lineasCierre.length * 16 + 55;

    doc.text('Cordialmente,', margin, y); y += 55;
    doc.setFont('times','bold');
    doc.text(data.funcionario || '[Pendiente de asignar]', margin, y); y += 15;
    doc.setFont('times','normal');
    doc.text(t.firmante, margin, y); y += 15;
    doc.text('Alcaldía Municipal de Puerto Escondido, Córdoba', margin, y);

    const blob = doc.output('blob');
    const filename = current + '-' + (data.nombre || 'documento').replace(/\s+/g,'-').toLowerCase() + '.pdf';

    let downloads = null;
    try{ downloads = await window.claude?.use?.('downloads'); }catch(e){ downloads = null; }

    if(downloads){
      try{
        await downloads.save({ filename, data: blob });
        statusEl.textContent = 'Documento generado y guardado.';
        statusEl.className = 'status ok';
      }catch(err){
        statusEl.textContent = (err && err.code === 'declined') ? 'Descarga cancelada.' : 'No se pudo guardar el archivo.';
        statusEl.className = 'status err';
      }
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      statusEl.textContent = 'Documento generado y descargado.';
      statusEl.className = 'status ok';
    }
  }catch(e){
    statusEl.textContent = 'Ocurrió un error generando el PDF.';
    statusEl.className = 'status err';
  }finally{
    btn.disabled = false;
  }
}

renderTabs();
renderForm();
</script>
</body>
</html>
